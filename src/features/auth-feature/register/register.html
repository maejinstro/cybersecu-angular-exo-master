<h1>Inscription</h1>
<form (ngSubmit)="submit()">
  <input name="username" placeholder="Nom d'utilisateur" [(ngModel)]="form.username" />
  <input name="email" type="email" placeholder="Email" [(ngModel)]="form.email" />
  <input name="password" type="password" placeholder="Mot de passe" [(ngModel)]="form.password" />
  <button type="submit">S'inscrire</button>
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
</form>
<p>Déjà inscrit ? <a routerLink="/login">Connexion</a></p>
